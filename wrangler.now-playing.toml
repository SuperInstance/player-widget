name = "ch42-now-playing"
main = "now-playing-worker.js"
compatibility_date = "2025-01-01"

# KV Namespace for now-playing data
[[kv_namespaces]]
binding = "NOW_PLAYING_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

# Route (optional — configure after first deploy)
# routes = [
#   { pattern = "now-playing.luciddreamer.ai/*", zone_name = "luciddreamer.ai" }
# ]

# Secrets (set via `wrangler secret put SCHEDULER_API_KEY`)
# [vars]
# SCHEDULER_API_KEY is a secret — do not put it here
