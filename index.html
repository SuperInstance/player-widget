<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0a0e27">
  <meta name="description" content="Channel 42 — AI-generated ambient dream radio. Streaming 24/7 from the fleet.">
  <title>Channel 42 · LucidDreamer.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Animated dawn gradient overlay -->
  <div class="dawn-overlay" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true" id="stars"></div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="brand-42" aria-hidden="true">42</span>
      <div class="brand-text">
        <h1 class="brand-name">Channel 42</h1>
        <p class="brand-sub">LucidDreamer.AI</p>
      </div>
    </div>
    <div class="live-indicator" id="liveIndicator" role="status" aria-live="polite">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="live-text">Connecting…</span>
    </div>
  </header>

  <!-- Main player card -->
  <main class="player-container" role="main">
    <section class="glass-panel now-playing" aria-label="Now playing">
      <!-- Now Playing Info -->
      <div class="track-info">
        <p class="np-label">Now Playing</p>
        <h2 class="track-title" id="trackTitle">Tuning in…</h2>
        <p class="track-meta" id="trackMeta">—</p>
        <p class="track-desc" id="trackDesc">Connecting to the Channel 42 broadcast.</p>
      </div>

      <!-- Waveform Visualizer -->
      <div class="visualizer-wrap">
        <canvas id="visualizer" class="visualizer" aria-hidden="true"></canvas>
        <div class="visualizer-fallback" id="vizFallback"></div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-section">
        <span class="time-label" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" role="slider" aria-label="Track progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
        <span class="time-label" id="totalTime">--:--</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn ctrl-secondary" id="prevBtn" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="playBtn" aria-label="Play or pause" title="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-secondary" id="nextBtn" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume-section">
        <svg class="vol-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="75" aria-label="Volume">
      </div>
    </section>

    <!-- Up Next -->
    <section class="glass-panel up-next" aria-label="Upcoming tracks">
      <h3 class="section-title">Up Next</h3>
      <ul class="up-next-list" id="upNextList">
        <li class="up-next-item placeholder">
          <span class="un-time">—</span>
          <div class="un-info">
            <span class="un-title">Loading schedule…</span>
            <span class="un-meta">—</span>
          </div>
        </li>
      </ul>
    </section>

    <!-- Feedback -->
    <section class="glass-panel feedback" aria-label="Listener feedback">
      <h3 class="section-title">Tell the fleet what you think</h3>
      <div class="feedback-row">
        <input type="text" id="feedbackInput" class="feedback-input" placeholder="This track feels like floating through a nebula…" maxlength="500" aria-label="Your feedback">
        <button id="feedbackSubmit" class="feedback-submit" aria-label="Submit feedback">Send ✈</button>
      </div>
      <p class="feedback-status" id="feedbackStatus" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Channel 42 · Broadcasting from the AI fleet · <span id="listenerCount">—</span> dreaming</p>
  </footer>

  <!-- HLS.js for stream playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
